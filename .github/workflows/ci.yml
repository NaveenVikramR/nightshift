name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Also runs `prisma generate` (postinstall). No database or network needed.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests use fakes only (no Prometheus, Alertmanager, DB or Telegram).
      - run: npm test

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan every commit for secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}
          git /repo --log-opts=--all --redact --no-banner --exit-code 1
        env:
          GITLEAKS_VERSION: v8.28.0
