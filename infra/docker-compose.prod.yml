# Production stack (single EC2 instance). Only Caddy publishes ports (80/443);
# Nightshift, demo-target, Prometheus and Alertmanager are reachable only on
# the compose network. Secrets live in env files OUTSIDE the repo
# (${NIGHTSHIFT_ENV_DIR}, default /opt/nightshift/env, chmod 600).
#
#   docker compose -f infra/docker-compose.prod.yml --profile migrate run --rm migrate
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# Images: with NIGHTSHIFT_IMAGE_PREFIX=ghcr.io/<owner>/nightshift (set by infra/deploy/up.sh
# from deploy.env) they are PULLED from GHCR (built by .github/workflows/images.yml);
# without it they are built locally and tagged nightshift-local-<service>.
name: nightshift-prod

x-restart: &restart
  restart: unless-stopped

services:
  # One-shot: apply Prisma migrations to the prod database (uses the build stage,
  # which has the Prisma CLI; the runtime image has production deps only).
  migrate:
    profiles: ['migrate']
    image: ${NIGHTSHIFT_IMAGE_PREFIX:-nightshift-local}-migrate:${NIGHTSHIFT_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: build
    working_dir: /app/apps/server
    env_file: ['${NIGHTSHIFT_ENV_DIR:-/opt/nightshift/env}/nightshift.env']
    command: ['npx', 'prisma', 'migrate', 'deploy']
    networks: [backend]

  nightshift:
    <<: *restart
    image: ${NIGHTSHIFT_IMAGE_PREFIX:-nightshift-local}-server:${NIGHTSHIFT_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runtime
    env_file: ['${NIGHTSHIFT_ENV_DIR:-/opt/nightshift/env}/nightshift.env']
    environment:
      # Listen on all interfaces INSIDE the container only (no published port).
      HOST: 0.0.0.0
      PORT: '3000'
      NIGHTSHIFT_CONFIG: config/nightshift.prod.yaml
      TRUST_PROXY: 'true'
    depends_on:
      demo-target: { condition: service_healthy }
      prometheus: { condition: service_healthy }
      alertmanager: { condition: service_healthy }
    mem_limit: 256m
    networks: [backend]

  demo-target:
    <<: *restart
    image: ${NIGHTSHIFT_IMAGE_PREFIX:-nightshift-local}-demo-target:${NIGHTSHIFT_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: apps/demo-target/Dockerfile
    env_file: ['${NIGHTSHIFT_ENV_DIR:-/opt/nightshift/env}/demo.env']
    environment:
      PORT: '8080'
    mem_limit: 96m
    networks: [backend]

  # Simulated Alexa+ (/alexa): a real MCP client of nightshift (in-network).
  alexa-sim:
    <<: *restart
    image: ${NIGHTSHIFT_IMAGE_PREFIX:-nightshift-local}-alexa-sim:${NIGHTSHIFT_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: apps/alexa-sim/Dockerfile
    env_file: ['${NIGHTSHIFT_ENV_DIR:-/opt/nightshift/env}/alexa.env']
    environment:
      NIGHTSHIFT_MCP_URL: http://nightshift:3000/mcp
      NIGHTSHIFT_DEPLOY_URL: http://nightshift:3000
      DEMO_ADMIN_URL: http://demo-target:8080
      SECURE_COOKIES: 'true'
    depends_on:
      nightshift: { condition: service_healthy }
    mem_limit: 256m
    networks: [backend]

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      demo-target: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks: [backend]

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.prod.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # webhook_token (chmod 600), written by infra/deploy/up.sh from nightshift.env
      - ${NIGHTSHIFT_ENV_DIR:-/opt/nightshift/env}/alertmanager:/etc/alertmanager-secrets:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9093/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    networks: [backend]

  caddy:
    <<: *restart
    image: caddy:2.8.4-alpine
    env_file: ['${NIGHTSHIFT_ENV_DIR:-/opt/nightshift/env}/caddy.env']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nightshift, alexa-sim]
    mem_limit: 128m
    networks: [backend]

networks:
  backend: {}

volumes:
  prometheus-data:
  alertmanager-data:
  caddy-data:
  caddy-config:
