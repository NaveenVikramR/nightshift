# Local observability stack for the Nightshift demo.
#   npm run stack:up     (needs Docker running and infra/.env; see infra/.env.example)
# All ports are bound to 127.0.0.1 only.
name: nightshift

services:
  demo-target:
    build:
      context: ..
      dockerfile: apps/demo-target/Dockerfile
    environment:
      PORT: '8080'
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?set DEMO_ADMIN_TOKEN in infra/.env}
    ports:
      # Host port 18080 by default: 8080 is often taken (e.g. a local Apache/XAMPP).
      - '127.0.0.1:${DEMO_TARGET_PORT:-18080}:8080'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      demo-target:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets/alertmanager:/etc/alertmanager-secrets:ro
      - alertmanager-data:/alertmanager
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9093:9093'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9093/-/ready']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional local Postgres for Nightshift (instead of Neon), only with the localdb profile:
  #   docker compose -f infra/docker-compose.yml --profile localdb up -d postgres
  #   DATABASE_URL=postgresql://nightshift:nightshift@127.0.0.1:5433/nightshift
  # Local development only: bound to 127.0.0.1, throwaway credentials.
  postgres:
    image: postgres:17-alpine
    profiles: ['localdb']
    environment:
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: nightshift
      POSTGRES_DB: nightshift
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nightshift', '-d', 'nightshift']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  postgres-data:
