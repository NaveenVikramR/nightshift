# Short intervals so the demo reacts within seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: demo-target
    static_configs:
      - targets: ['demo-target:8080']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
